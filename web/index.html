<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>CLB Manager - Đăng Nhập / Đăng Ký</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Đăng Nhập</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Đăng Ký</button>
      </div>

      <!-- II. FORM ĐĂNG NHẬP -->
      <form id="form-login" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Mã Số Sinh Viên (MSSV)</label>
          <input type="text" id="login-mssv" required placeholder="VD: SE123456">
        </div>
        <div class="form-group">
          <label>Mật Khẩu</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary">Đăng Nhập</button>
      </form>

      <!-- III. FORM ĐĂNG KÝ -->
      <form id="form-register" style="display: none;" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>MSSV</label>
          <input type="text" id="reg-mssv" required placeholder="MSSV chính thức">
        </div>
        <div class="form-group">
          <label>Email Đã Cung Cấp Cho CLB</label>
          <input type="email" id="reg-email" required placeholder="email@domain.com">
        </div>
        <div class="form-group">
          <label>Mật Khẩu</label>
          <input type="password" id="reg-password" required placeholder="Mật khẩu tối thiểu 6 ký tự">
        </div>
        <div class="form-group">
          <label>Xác Nhận Mật Khẩu</label>
          <input type="password" id="reg-confirm" required placeholder="Nhập lại mật khẩu">
        </div>
        <button type="submit" class="btn-primary">Đăng Ký Tài Khoản</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
