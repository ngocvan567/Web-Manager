<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký - Hệ thống Quản lý Câu lạc bộ</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">🎓</div>
        <h1>Đăng ký tài khoản</h1>
        <p>Hệ thống Quản lý Câu lạc bộ</p>
      </div>
      
      <div id="alertContainer"></div>
      
      <form class="auth-form" id="registerForm">
        <div class="form-group">
          <label for="mssv">MSSV *</label>
          <input type="text" class="form-control" id="mssv" placeholder="VD: SE12345" required>
        </div>
        
        <div class="form-group">
          <label for="name">Họ và tên *</label>
          <input type="text" class="form-control" id="name" placeholder="Nhập họ và tên" required>
        </div>
        
        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" class="form-control" id="email" placeholder="Nhập email" required>
        </div>
        
        <div class="form-group">
          <label for="phone">Số điện thoại</label>
          <input type="text" class="form-control" id="phone" placeholder="Nhập số điện thoại">
        </div>
        
        <div class="form-group">
          <label for="major">Ngành</label>
          <input type="text" class="form-control" id="major" placeholder="VD: Công nghệ thông tin">
        </div>
        
        <div class="form-group">
          <label for="course">Khóa</label>
          <input type="text" class="form-control" id="course" placeholder="VD: K2023">
        </div>
        
        <div class="form-group">
          <label for="password">Mật khẩu *</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="password" placeholder="Tối thiểu 6 ký tự" required minlength="6">
            <button type="button" class="password-toggle" onclick="togglePassword('password', this)">👁</button>
          </div>
        </div>
        
        <div class="form-group">
          <label for="confirmPassword">Xác nhận mật khẩu *</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
            <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)">👁</button>
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Đăng ký</button>
      </form>
      
      <div class="auth-footer">
        Đã có tài khoản? <a href="login.html">Đăng nhập</a>
      </div>
    </div>
  </div>
  
  <script src="js/mock-api.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Toggle password visibility
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁';
      }
    }
    
    // Handle register form submit
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const mssv = document.getElementById('mssv').value.trim();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const major = document.getElementById('major').value.trim();
      const course = document.getElementById('course').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      // Validate
      if (!mssv || !name || !email || !password || !confirmPassword) {
        Auth.showAlert('Vui lòng điền đầy đủ các trường bắt buộc', 'danger');
        return;
      }
      
      if (password !== confirmPassword) {
        Auth.showAlert('Mật khẩu xác nhận không khớp', 'danger');
        return;
      }
      
      if (password.length < 6) {
        Auth.showAlert('Mật khẩu phải có ít nhất 6 ký tự', 'danger');
        return;
      }
      
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        Auth.showAlert('Email không hợp lệ', 'danger');
        return;
      }
      
      try {
        const result = await API.Auth.register({
          mssv: mssv,
          name: name,
          email: email,
          phone: phone,
          major: major,
          course: course,
          password: password,
        });
        
        Auth.showAlert('Đăng ký thành công! Vui lòng đăng nhập.', 'success');
        
        // Redirect to login after successful registration
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);
      } catch (error) {
        Auth.showAlert(error.message, 'danger');
      }
    });
    
    // If already logged in, redirect
    if (Auth.isLoggedIn()) {
      Auth.redirectByRole();
    }
  </script>
</body>
</html>
