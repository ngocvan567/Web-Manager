<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý ban - Admin</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">🎓</div>
        <div class="sidebar-title">Quản lý CLB<small>ADMIN</small></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">Tổng quan</div>
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span>Dashboard</a>
        <div class="nav-section">Quản lý</div>
        <a href="users.html" class="nav-item"><span class="nav-icon">👤</span>Tài khoản</a>
        <a href="members.html" class="nav-item"><span class="nav-icon">👥</span>Thành viên</a>
        <a href="departments.html" class="nav-item active"><span class="nav-icon">🏢</span>Ban</a>
        <a href="events.html" class="nav-item"><span class="nav-icon">📅</span>Sự kiện</a>
        <a href="attendance.html" class="nav-item"><span class="nav-icon">✅</span>Điểm danh</a>
        <a href="announcements.html" class="nav-item"><span class="nav-icon">📢</span>Thông báo</a>
        <a href="registrations.html" class="nav-item"><span class="nav-icon">📝</span>Đăng ký hoạt động</a>
        <div class="nav-section">Hệ thống</div>
        <a href="statistics.html" class="nav-item"><span class="nav-icon">📊</span>Thống kê</a>
        <a href="storage.html" class="nav-item"><span class="nav-icon">📁</span>Kho lưu trữ</a>
        <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span>Cài đặt</a>
      </nav>
    </aside>
    
    <main class="admin-main">
      <header class="admin-topbar">
        <div class="topbar-left">
          <button class="menu-toggle">☰</button>
          <span class="topbar-title">Quản lý ban</span>
        </div>
        <div class="topbar-right">
          <div class="topbar-user">
            <div class="user-avatar">A</div>
            <div class="user-info"><div class="name">Admin</div><div class="role">ADMIN</div></div>
            <div class="user-dropdown">
              <a href="settings.html">Cài đặt</a>
              <a href="#" id="logoutBtn" class="danger">Đăng xuất</a>
            </div>
          </div>
        </div>
      </header>
      
      <div class="admin-content">
        <div id="alertContainer"></div>
        <div id="loadingContainer"></div>
        
        <div class="page-header">
          <div>
            <h1>Quản lý ban</h1>
            <p>Quản lý các ban của câu lạc bộ</p>
          </div>
          <button class="btn btn-primary" id="addDepartmentBtn">+ Thêm ban</button>
        </div>
        
        <div id="departmentsList"></div>
      </div>
    </main>
  </div>
  
  <!-- Department Modal -->
  <div class="modal-overlay" id="departmentModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="departmentModalTitle">Chi tiết ban</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="departmentModalBody"></div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="document.getElementById('departmentModal').classList.remove('active')">Đóng</button>
        <button class="btn btn-primary" id="departmentModalSubmit">Lưu</button>
      </div>
    </div>
  </div>
  
  <script src="../js/mock-api.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/departments.js"></script>
</body>
</html>
