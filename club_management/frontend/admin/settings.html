<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cài đặt - Admin</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">🎓</div>
        <div class="sidebar-title">Quản lý CLB<small>ADMIN</small></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">Tổng quan</div>
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span>Dashboard</a>
        <div class="nav-section">Quản lý</div>
        <a href="users.html" class="nav-item"><span class="nav-icon">👤</span>Tài khoản</a>
        <a href="members.html" class="nav-item"><span class="nav-icon">👥</span>Thành viên</a>
        <a href="departments.html" class="nav-item"><span class="nav-icon">🏢</span>Ban</a>
        <a href="events.html" class="nav-item"><span class="nav-icon">📅</span>Sự kiện</a>
        <a href="attendance.html" class="nav-item"><span class="nav-icon">✅</span>Điểm danh</a>
        <a href="announcements.html" class="nav-item"><span class="nav-icon">📢</span>Thông báo</a>
        <a href="registrations.html" class="nav-item"><span class="nav-icon">📝</span>Đăng ký hoạt động</a>
        <div class="nav-section">Hệ thống</div>
        <a href="statistics.html" class="nav-item"><span class="nav-icon">📊</span>Thống kê</a>
        <a href="storage.html" class="nav-item"><span class="nav-icon">📁</span>Kho lưu trữ</a>
        <a href="settings.html" class="nav-item active"><span class="nav-icon">⚙️</span>Cài đặt</a>
      </nav>
    </aside>
    
    <main class="admin-main">
      <header class="admin-topbar">
        <div class="topbar-left">
          <button class="menu-toggle">☰</button>
          <span class="topbar-title">Cài đặt</span>
        </div>
        <div class="topbar-right">
          <div class="topbar-user">
            <div class="user-avatar">A</div>
            <div class="user-info"><div class="name">Admin</div><div class="role">ADMIN</div></div>
            <div class="user-dropdown">
              <a href="settings.html">Cài đặt</a>
              <a href="#" id="logoutBtn" class="danger">Đăng xuất</a>
            </div>
          </div>
        </div>
      </header>
      
      <div class="admin-content">
        <div id="alertContainer"></div>
        
        <div class="page-header">
          <div>
            <h1>Cài đặt hệ thống</h1>
            <p>Quản lý cài đặt hệ thống</p>
          </div>
        </div>
        
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Thông tin câu lạc bộ</h3>
          </div>
          <form id="clubSettingsForm">
            <div class="form-group">
              <label>Tên câu lạc bộ</label>
              <input type="text" class="form-control" name="club_name" value="Câu lạc bộ" placeholder="Nhập tên câu lạc bộ">
            </div>
            <div class="form-group">
              <label>Mô tả</label>
              <textarea class="form-control" name="club_description" placeholder="Mô tả về câu lạc bộ"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Lưu cài đặt</button>
          </form>
        </div>
        
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">Đổi mật khẩu</h3>
          </div>
          <form id="adminChangePasswordForm">
            <div class="form-group">
              <label>Mật khẩu hiện tại</label>
              <input type="password" class="form-control" name="current_password" required>
            </div>
            <div class="form-group">
              <label>Mật khẩu mới</label>
              <input type="password" class="form-control" name="new_password" required minlength="6">
            </div>
            <div class="form-group">
              <label>Xác nhận mật khẩu mới</label>
              <input type="password" class="form-control" name="confirm_password" required>
            </div>
            <button type="submit" class="btn btn-primary">Đổi mật khẩu</button>
          </form>
        </div>
      </div>
    </main>
  </div>
  
  <script src="../js/mock-api.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.requireAdmin()) return;
      
      // Handle club settings form
      document.getElementById('clubSettingsForm').addEventListener('submit', (e) => {
        e.preventDefault();
        Auth.showAlert('Cài đặt đã được lưu!', 'success');
      });
      
      // Handle change password form
      document.getElementById('adminChangePasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const form = e.target;
        const formData = new FormData(form);
        const currentPassword = formData.get('current_password');
        const newPassword = formData.get('new_password');
        const confirmPassword = formData.get('confirm_password');
        
        if (newPassword !== confirmPassword) {
          Auth.showAlert('Mật khẩu xác nhận không khớp', 'danger');
          return;
        }
        
        try {
          await API.Profile.changePassword({
            current_password: currentPassword,
            new_password: newPassword,
          });
          Auth.showAlert('Đổi mật khẩu thành công!', 'success');
          form.reset();
        } catch (error) {
          Auth.showAlert(error.message, 'danger');
        }
      });
    });
  </script>
</body>
</html>
