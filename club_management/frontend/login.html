<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Hệ thống Quản lý Câu lạc bộ</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">🎓</div>
        <h1>Đăng nhập</h1>
        <p>Hệ thống Quản lý Câu lạc bộ</p>
      </div>
      
      <div id="alertContainer"></div>
      
      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label for="identifier">MSSV / Email</label>
          <input type="text" class="form-control" id="identifier" placeholder="Nhập MSSV hoặc Email" required>
        </div>
        
        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
            <button type="button" class="password-toggle" onclick="togglePassword('password', this)">👁</button>
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
      </form>
      
      <div class="auth-footer">
        Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
      </div>
    </div>
  </div>
  
  <script src="js/mock-api.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Toggle password visibility
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁';
      }
    }
    
    // Handle login form submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;
      
      if (!identifier || !password) {
        Auth.showAlert('Vui lòng nhập đầy đủ thông tin', 'danger');
        return;
      }
      
      try {
        const result = await API.Auth.login({
          username: identifier,
          password: password,
        });
        
        // Save auth data
        Auth.saveAuthData(result.token, result.user);
        
        // Redirect based on role
        Auth.redirectByRole();
      } catch (error) {
        Auth.showAlert(error.message || 'Đăng nhập thất bại. Vui lòng kiểm tra Backend và database.', 'danger');
      }
    });
    
    // If already logged in, redirect
    if (Auth.isLoggedIn()) {
      Auth.redirectByRole();
    }
  </script>
</body>
</html>
