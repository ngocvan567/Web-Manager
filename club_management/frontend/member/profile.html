<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ sơ - Thành viên</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/member.css">
</head>
<body>
  <div class="member-layout">
    <aside class="member-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">🎓</div>
        <div class="sidebar-title">Quản lý CLB<small>MEMBER</small></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">Menu</div>
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span>Dashboard</a>
        <a href="profile.html" class="nav-item active"><span class="nav-icon">👤</span>Hồ sơ</a>
        <a href="events.html" class="nav-item"><span class="nav-icon">📅</span>Sự kiện</a>
        <a href="attendance.html" class="nav-item"><span class="nav-icon">✅</span>Điểm danh</a>
        <a href="attendance-history.html" class="nav-item"><span class="nav-icon">📊</span>Chuyên cần</a>
        <a href="announcements.html" class="nav-item"><span class="nav-icon">📢</span>Thông báo</a>
        <a href="change-password.html" class="nav-item"><span class="nav-icon">🔒</span>Đổi mật khẩu</a>
        <div class="nav-section">Ban của tôi</div>
        <a href="departments/academic.html" class="nav-item"><span class="nav-icon">🏢</span>Ban Học thuật</a>
        <a href="departments/operation.html" class="nav-item"><span class="nav-icon">🏢</span>Ban Vận hành</a>
        <a href="departments/advisory.html" class="nav-item"><span class="nav-icon">🏢</span>Ban Cố vấn</a>
        <a href="departments/executive.html" class="nav-item"><span class="nav-icon">🏢</span>Ban Chủ nhiệm</a>
      </nav>
    </aside>
    
    <main class="member-main">
      <header class="member-topbar">
        <div class="topbar-left">
          <button class="menu-toggle">☰</button>
          <span class="topbar-title">Hồ sơ</span>
        </div>
        <div class="topbar-right">
          <div class="topbar-user">
            <div class="user-avatar">M</div>
            <div class="user-info"><div class="name">Thành viên</div><div class="role">MEMBER</div></div>
            <div class="user-dropdown">
              <a href="profile.html">Hồ sơ</a>
              <a href="#" id="logoutBtn" class="danger">Đăng xuất</a>
            </div>
          </div>
        </div>
      </header>
      
      <div class="member-content" id="memberProfile">
        <div id="alertContainer"></div>
        <div id="loadingContainer"></div>
        
        <div class="page-header">
          <div>
            <h1>Hồ sơ cá nhân</h1>
            <p>Thông tin cá nhân của bạn</p>
          </div>
        </div>
        
        <div class="profile-header">
          <div class="profile-avatar" id="profileAvatar">M</div>
          <div class="profile-info">
            <h2 id="profileName">-</h2>
            <p id="profileMssv">-</p>
            <div class="mt-1" id="profileDeptBadge"></div>
          </div>
        </div>
        
        <div class="profile-grid">
          <div class="profile-field">
            <label>MSSV</label>
            <div class="value" id="profileMssvField">-</div>
          </div>
          <div class="profile-field">
            <label>Họ tên</label>
            <div class="value" id="profileNameField">-</div>
          </div>
          <div class="profile-field">
            <label>Email</label>
            <div class="value" id="profileEmail">-</div>
          </div>
          <div class="profile-field">
            <label>Số điện thoại</label>
            <div class="value" id="profilePhone">-</div>
          </div>
          <div class="profile-field">
            <label>Ngành</label>
            <div class="value" id="profileMajor">-</div>
          </div>
          <div class="profile-field">
            <label>Khóa</label>
            <div class="value" id="profileCourse">-</div>
          </div>
          <div class="profile-field">
            <label>Ban</label>
            <div class="value" id="profileDepartment">-</div>
          </div>
          <div class="profile-field">
            <label>Role</label>
            <div class="value" id="profileRole">-</div>
          </div>
          <div class="profile-field">
            <label>Status</label>
            <div class="value" id="profileStatus">-</div>
          </div>
        </div>
        
        <div class="card mt-3">
          <div class="card-header">
            <h3 class="card-title">Cập nhật thông tin</h3>
          </div>
          <form id="profileForm">
            <div class="stat-grid">
              <div class="form-group">
                <label>Họ tên</label>
                <input type="text" class="form-control" name="name" id="editName">
              </div>
              <div class="form-group">
                <label>Số điện thoại</label>
                <input type="text" class="form-control" name="phone" id="editPhone">
              </div>
              <div class="form-group">
                <label>Ngành</label>
                <input type="text" class="form-control" name="major" id="editMajor">
              </div>
              <div class="form-group">
                <label>Khóa</label>
                <input type="text" class="form-control" name="course" id="editCourse">
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Cập nhật hồ sơ</button>
          </form>
        </div>
      </div>
    </main>
  </div>
  
  <script src="../js/mock-api.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/member.js"></script>
</body>
</html>
