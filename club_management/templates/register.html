<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Tài khoản - Quản Lý CLB</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>ĐĂNG KÝ THÀNH VIÊN</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>MSSV</label>
                    <input type="text" id="mssv" class="form-control" placeholder="Ví dụ: SE12345" required>
                </div>
                <div class="form-group">
                    <label>Họ và Tên</label>
                    <input type="text" id="fullName" class="form-control" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" placeholder="a@gmail.com" required>
                </div>
                <div class="form-group">
                    <label>Khóa</label>
                    <input type="text" id="course" class="form-control" value="K19" required>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Xác nhận Mật khẩu</label>
                    <input type="password" id="confirmPassword" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">Tạo Tài Khoản</button>
            </form>
            <p style="margin-top:20px; text-align:center; font-size:0.9rem;">
                Đã có tài khoản? <a href="/login" style="color:var(--primary); font-weight:600; text-decoration:none;">Đăng nhập</a>
            </p>
        </div>
    </div>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
