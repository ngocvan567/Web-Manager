<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản Lý Câu Lạc Bộ</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>ĐĂNG NHẬP CLB</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>MSSV hoặc Email</label>
                    <input type="text" id="account" class="form-control" placeholder="Nhập MSSV hoặc Email" required>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">Đăng Nhập</button>
            </form>
            <p style="margin-top:20px; text-align:center; font-size:0.9rem;">
                Chưa có tài khoản? <a href="/register" style="color:var(--primary); font-weight:600; text-decoration:none;">Đăng ký ngay</a>
            </p>
        </div>
    </div>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
